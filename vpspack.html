<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPSPack - Script Administrativo para VPS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(to bottom, #000000, #222222);
    color: white;
    font-family: Arial, sans-serif;
    overflow-y: auto;
    padding: 20px;
}

/* CONTENIDO */
body > * {
    position: relative;
    z-index: 2;
}

/* FONDO */
.lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 200%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

/* LÍNEAS */
.line {
    position: absolute;
    width: 1px;
    height: 120%;
    background: rgba(255,255,255,0.08);
}

.line::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 20vh;
    top: -50%;
    background: linear-gradient(to bottom, transparent, #fff);
    opacity: 0.8;
}

/* CONTENEDOR */
.container {
    max-width: 500px;
    margin: auto;
}

.image-container {
    margin: 15px 0;
}

.image-container img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.description {
    margin-bottom: 20px;
    line-height: 1.6;
    color: #ccc;
}

.highlight {
    color: #ffcc00;
}

.description a {
    color: #ffcc00;
    text-decoration: none;
}

.description a:hover {
    color: #ffd700;
}

.close-button {
    width: 100%;
    padding: 12px;
    background: #ffcc00;
    color: black;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.close-button:hover {
    background: #ffaa00;
}
</style>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="lines" id="lines"></div>

<div class="container">

    <div class="image-container">
        <img src="https://raw.githubusercontent.com/powermx/dl/master/vpspack.png">
    </div>

    <div class="description">
        <strong class="highlight">VPSPack</strong> es un script administrativo para VPS basado en 
        <strong class="highlight">Ubuntu</strong> y <strong class="highlight">Debian</strong>.
    </div>

    <div class="description">
        Facilita la instalación de paquetes, usuarios, proxies y VPN.
    </div>

    <div class="image-container">
        <img src="https://raw.githubusercontent.com/powermx/dl/master/vpspack_paquetes.png">
    </div>

    <div class="description">
        Contacto: <a href="https://t.me/PowerMX">@PowerMX</a>
    </div>

    <button class="close-button" onclick="closeWebApp()">Cerrar</button>

</div>

<script>
const container = document.getElementById("lines");
const totalLines = 20;

let lines = [];

/* CREAR LÍNEAS RANDOM */
for (let i = 0; i < totalLines; i++) {
    const line = document.createElement("div");
    line.classList.add("line");

    const left = Math.random() * 100;
    const speed = 2 + Math.random() * 6;
    const delay = Math.random() * 5;
    const drift = (Math.random() - 0.5) * 50;

    line.style.left = left + "%";

    container.appendChild(line);

    lines.push({
        el: line,
        speed,
        delay,
        drift,
        progress: Math.random()
    });
}

/* ANIMACIÓN */
function animateLines() {
    lines.forEach(line => {
        line.progress += 0.002 * line.speed;

        if (line.progress > 1.2) {
            line.progress = -0.2;
            line.el.style.left = Math.random() * 100 + "%";
        }

        const y = line.progress * window.innerHeight * 2;
        const x = line.drift * Math.sin(line.progress * Math.PI);

        line.el.style.transform = `translate(${x}px, ${y}px)`;
    });

    requestAnimationFrame(animateLines);
}

/* PARALLAX SCROLL */
window.addEventListener("scroll", () => {
    const scrollY = window.scrollY;
    container.style.transform = `translateY(${scrollY * 0.2}px)`;
});

/* INIT */
animateLines();

/* TELEGRAM */
function closeWebApp() {
    if (window.Telegram?.WebApp) {
        Telegram.WebApp.close();
    } else {
        alert("Solo funciona dentro de Telegram");
    }
}

if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}
</script>

</body>
</html>
