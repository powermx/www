<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPSPack</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    position: relative;
    background: linear-gradient(to bottom, #000000, #222222);
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

/* CONTENIDO ENCIMA */
body > * {
    position: relative;
    z-index: 2;
}

/* FONDO AJUSTADO */
.lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

/* LÍNEAS */
.line {
    position: absolute;
    width: 1px;
    background: rgba(255,255,255,0.08);
}

.line::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 120px;
    background: linear-gradient(to bottom, transparent, #fff);
}

/* CONTENIDO */
.container {
    max-width: 500px;
    margin: auto;
}

.image-container {
    margin: 15px 0;
}

.image-container img {
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.description {
    margin-bottom: 20px;
    line-height: 1.6;
    color: #ccc;
}

.highlight {
    color: #ffcc00;
}

.close-button {
    width: 100%;
    padding: 12px;
    background: #ffcc00;
    color: black;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="lines" id="lines"></div>

<div class="container" id="content">

    <div class="image-container">
        <img src="https://raw.githubusercontent.com/powermx/dl/master/vpspack.png">
    </div>

    <div class="description">
        <strong class="highlight">VPSPack</strong> es un script para VPS basado en Ubuntu y Debian.
    </div>

    <div class="description">
        Facilita instalación de servicios, proxies y VPN.
    </div>

    <div class="image-container">
        <img src="https://raw.githubusercontent.com/powermx/dl/master/vpspack_paquetes.png">
    </div>

    <button class="close-button" onclick="closeWebApp()">Cerrar</button>

</div>

<script>
const container = document.getElementById("lines");
const content = document.getElementById("content");
const totalLines = 20;

let lines = [];

/* AJUSTAR ALTURA EXACTA */
function setHeight() {
    const height = content.offsetHeight + 40; // pequeño margen
    container.style.height = height + "px";
}

/* CREAR LÍNEAS */
function createLines() {
    container.innerHTML = "";
    lines = [];

    const height = container.offsetHeight;

    for (let i = 0; i < totalLines; i++) {
        const line = document.createElement("div");
        line.classList.add("line");

        const left = Math.random() * 100;
        const speed = 0.5 + Math.random() * 1.5;
        const drift = (Math.random() - 0.5) * 60;

        line.style.left = left + "%";
        line.style.height = height + "px";

        container.appendChild(line);

        lines.push({
            el: line,
            y: Math.random() * height,
            speed,
            drift
        });
    }
}

/* ANIMACIÓN */
function animate() {
    const height = container.offsetHeight;

    lines.forEach(line => {
        line.y += line.speed;

        if (line.y > height) {
            line.y = -100;
            line.el.style.left = Math.random() * 100 + "%";
        }

        const x = line.drift * Math.sin(line.y * 0.01);

        line.el.style.transform = `translate(${x}px, ${line.y}px)`;
    });

    requestAnimationFrame(animate);
}

/* INIT */
function init() {
    setHeight();
    createLines();
    animate();
}

/* REAJUSTE SOLO SI CAMBIA EL TAMAÑO */
window.addEventListener("resize", init);

init();

/* TELEGRAM */
function closeWebApp() {
    if (window.Telegram?.WebApp) {
        Telegram.WebApp.close();
    } else {
        alert("Solo funciona dentro de Telegram");
    }
}

if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}
</script>

</body>
</html>
